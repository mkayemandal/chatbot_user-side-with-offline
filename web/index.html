    // Initialize Firebase only if not already initialized
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    // Global error handler for Firestore internal assertion failures
    window.addEventListener('error', function(event) {
      if (event.error && event.error.message && 
          (event.error.message.includes('INTERNAL ASSERTION FAILED') || 
           event.error.message.includes('Unexpected state'))) {
        console.warn('🚨 Caught Firestore internal assertion failure:', event.error.message);
        event.preventDefault(); // Prevent the error from crashing the app
        return false;
      }
    });

    // Handle unhandled promise rejections
    window.addEventListener('unhandledrejection', function(event) {
      if (event.reason && event.reason.message && 
          (event.reason.message.includes('INTERNAL ASSERTION FAILED') || 
           event.reason.message.includes('Unexpected state'))) {
        console.warn('🚨 Caught Firestore internal assertion failure in promise:', event.reason.message);
        event.preventDefault(); // Prevent the error from crashing the app
        return false;
      }
    });
  </script>
